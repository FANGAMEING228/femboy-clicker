<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ня-клікер 🐾</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(135deg, #ffd6ec, #d6e4ff, #e8d6ff);
    background-size: 300% 300%;
    animation: bg 12s ease infinite;
    color: #4a2c5a;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px;
    overflow-x: hidden;
  }
  @keyframes bg { 0%,100% {background-position: 0% 50%} 50% {background-position: 100% 50%} }

  .panel {
    background: rgba(255,255,255,.65); backdrop-filter: blur(6px);
    border-radius: 24px; padding: 20px;
    box-shadow: 0 8px 30px rgba(120, 60, 160, .2);
  }
  #game { flex: 1 1 340px; max-width: 460px; text-align: center; position: relative; }
  #shop { flex: 1 1 300px; max-width: 400px; }

  h1 { margin: 0 0 6px; font-size: 28px; }
  #score { font-size: 46px; font-weight: 800; color: #d6438f; }
  #cps { opacity: .8; margin-bottom: 8px; }

  #stage { position: relative; height: 330px; display: flex; align-items: flex-end; justify-content: center; }
  #bubble {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%) scale(0);
    background: #fff; border: 3px solid #ff8cc6; border-radius: 20px;
    padding: 6px 16px; font-weight: 800; font-size: 22px; color: #d6438f;
    transition: transform .15s; white-space: nowrap; z-index: 2;
  }
  #bubble.show { transform: translateX(-50%) scale(1); }
  #bubble::after {
    content: ""; position: absolute; bottom: -12px; left: 50%; margin-left: -8px;
    border: 8px solid transparent; border-top-color: #ff8cc6; border-bottom: 0;
  }

  #char { width: 270px; cursor: pointer; transition: transform .1s; filter: drop-shadow(0 8px 10px rgba(0,0,0,.15)); animation: idle 3s ease-in-out infinite; }
  #char:hover { transform: scale(1.04); }
  #char.pop { animation: none; transform: scale(.88, 1.1); }
  @keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }

  .hair { fill: var(--hair); }
  .hoodie { fill: var(--hoodie); }
  .happy, .open { display: none; }
  #char.pop .normal { display: none; }
  #char.pop .happy, #char.pop .open { display: inline; }
  #char.pop .closed { display: none; }

  .float {
    position: fixed; pointer-events: none; font-weight: 800; font-size: 24px;
    color: #d6438f; text-shadow: 0 2px 0 #fff, 0 0 8px #fff;
    animation: up 1s ease-out forwards; z-index: 10;
  }
  @keyframes up { to { transform: translateY(-90px) scale(1.3); opacity: 0; } }

  h2 { margin: 0 0 10px; }
  .item {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 14px; margin-bottom: 10px;
    cursor: pointer; border: 2px solid transparent; transition: .15s;
  }
  .item:hover:not(.locked) { border-color: #ff8cc6; transform: translateX(3px); }
  .item.locked { opacity: .5; cursor: not-allowed; }
  .item b { display: block; }
  .item small { opacity: .7; }
  .cost { font-weight: 800; color: #d6438f; white-space: nowrap; margin-left: 10px; }
  .count { background: #ffd0e8; border-radius: 12px; padding: 2px 10px; font-weight: 800; margin-left: 8px; }

  #skins { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .skin {
    padding: 8px 12px; border-radius: 14px; background: #fff; cursor: pointer;
    border: 3px solid transparent; font-size: 14px; font-weight: 600;
  }
  .skin.active { border-color: #d6438f; }
  .skin.locked { opacity: .45; cursor: not-allowed; }
  #reset { margin-top: 14px; background: none; border: none; color: #8a6a9a; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div id="game" class="panel">
  <h1>🐾 Ня-клікер 🐾</h1>
  <div id="score">0</div>
  <div id="cps">ня за секунду: 0</div>

  <div id="stage">
    <div id="bubble">ня!</div>

    <svg id="char" viewBox="0 0 200 250">
      <!-- тіло -->
      <path class="hoodie" d="M20 250 Q22 175 70 162 L130 162 Q178 175 180 250 Z"/>
      <path d="M78 162 Q100 190 122 162 Z" fill="#fff" opacity=".35"/>
      <!-- волосся ззаду -->
      <ellipse class="hair" cx="100" cy="105" rx="64" ry="68"/>
      <!-- вушка -->
      <polygon class="hair" points="38,70 52,12 92,42"/>
      <polygon class="hair" points="162,70 148,12 108,42"/>
      <polygon points="52,55 57,28 77,44" fill="#ffb3d1"/>
      <polygon points="148,55 143,28 123,44" fill="#ffb3d1"/>
      <!-- обличчя -->
      <ellipse cx="100" cy="112" rx="50" ry="50" fill="#ffe6d5"/>
      <!-- чубчик -->
      <path class="hair" d="M48 98 Q50 48 100 46 Q150 48 152 98 Q135 70 112 72 Q104 86 98 72 Q75 68 48 98 Z"/>
      <!-- очі звичайні -->
      <g class="normal">
        <ellipse cx="80" cy="115" rx="9" ry="13" fill="#3b2a66"/>
        <ellipse cx="120" cy="115" rx="9" ry="13" fill="#3b2a66"/>
        <circle cx="83" cy="110" r="4" fill="#fff"/>
        <circle cx="123" cy="110" r="4" fill="#fff"/>
        <circle cx="77" cy="120" r="2" fill="#fff"/>
        <circle cx="117" cy="120" r="2" fill="#fff"/>
      </g>
      <!-- очі щасливі ^ ^ -->
      <g class="happy" fill="none" stroke="#3b2a66" stroke-width="4" stroke-linecap="round">
        <path d="M69 120 Q80 103 91 120"/>
        <path d="M109 120 Q120 103 131 120"/>
      </g>
      <!-- рум'янці -->
      <ellipse cx="68" cy="135" rx="9" ry="5" fill="#ff9ec4" opacity=".7"/>
      <ellipse cx="132" cy="135" rx="9" ry="5" fill="#ff9ec4" opacity=".7"/>
      <!-- рот -->
      <path class="closed" d="M90 140 Q95 147 100 140 Q105 147 110 140" fill="none" stroke="#c0446e" stroke-width="3" stroke-linecap="round"/>
      <ellipse class="open" cx="100" cy="143" rx="7" ry="8" fill="#c0446e"/>
      <ellipse class="open" cx="100" cy="147" rx="4" ry="3" fill="#ff8aa8"/>
    </svg>
  </div>
  <button id="reset">скинути прогрес</button>
</div>

<div id="shop" class="panel">
  <h2>🛒 Магазин</h2>
  <div id="items"></div>
  <h2>👕 Образи</h2>
  <div id="skins"></div>
</div>

<script>
const phrases = ["ня!", "ня~", "ня-ня!", "нЯ?!", "ня♡", "мур~", "нья!", "ня-а-а~", "ню~"];

const upgradesDef = [
  { id: "power",  name: "👆 Сильніший тик",     desc: "+1 ня за клік",         base: 15,    type: "click", value: 1 },
  { id: "ears",   name: "🐱 Котячі вушка",      desc: "+5 ня за клік",         base: 250,   type: "click", value: 5 },
  { id: "helper", name: "🧑‍🎤 Помічник-фембой",   desc: "+1 ня за секунду",      base: 50,    type: "auto",  value: 1 },
  { id: "coffee", name: "☕ Кава з молоком",     desc: "+6 ня за секунду",      base: 400,   type: "auto",  value: 6 },
  { id: "band",   name: "🎀 Ня-гурт",           desc: "+30 ня за секунду",     base: 2500,  type: "auto",  value: 30 },
  { id: "farm",   name: "🏠 Ня-ферма",          desc: "+150 ня за секунду",    base: 15000, type: "auto",  value: 150 },
];

const skinsDef = [
  { name: "Рожевий",    hair: "#ff8cc6", hoodie: "#b48cff", need: 0 },
  { name: "Блакитний",  hair: "#7cc6ff", hoodie: "#ff9ec4", need: 200 },
  { name: "М'ятний",    hair: "#7ee8c0", hoodie: "#ffd36e", need: 1000 },
  { name: "Білий",      hair: "#f4f1ff", hoodie: "#6a5acd", need: 5000 },
  { name: "Фіолетовий", hair: "#a06cf0", hoodie: "#222a44", need: 20000 },
  { name: "Золотий",    hair: "#ffd45e", hoodie: "#ff6f91", need: 100000 },
];

let state = load() || { score: 0, total: 0, owned: {}, skin: 0 };

function load() { try { return JSON.parse(localStorage.getItem("nyaClicker")); } catch { return null; } }
function save() { localStorage.setItem("nyaClicker", JSON.stringify(state)); }

const $ = id => document.getElementById(id);
const fmt = n => n >= 1e9 ? (n/1e9).toFixed(2)+"B" : n >= 1e6 ? (n/1e6).toFixed(2)+"M" : n >= 1e4 ? (n/1e3).toFixed(1)+"K" : Math.floor(n).toString();

const cost = u => Math.floor(u.base * Math.pow(1.15, state.owned[u.id] || 0));
const perClick = () => 1 + upgradesDef.filter(u => u.type==="click").reduce((s,u) => s + u.value*(state.owned[u.id]||0), 0);
const perSec = () => upgradesDef.filter(u => u.type==="auto").reduce((s,u) => s + u.value*(state.owned[u.id]||0), 0);

// ---- звук (маленький «ня») ----
let audio;
function meow() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "triangle";
    const t = audio.currentTime, f = 600 + Math.random()*200;
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f*1.6, t+.08);
    o.frequency.exponentialRampToValueAtTime(f*.8, t+.22);
    g.gain.setValueAtTime(.15, t);
    g.gain.exponentialRampToValueAtTime(.001, t+.25);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t+.25);
  } catch {}
}

// ---- клік ----
const char = $("char"), bubble = $("bubble");
let bubbleTimer, popTimer;

function clickChar(e) {
  const gain = perClick();
  state.score += gain; state.total += gain;

  const word = phrases[Math.floor(Math.random()*phrases.length)];
  bubble.textContent = word;
  bubble.classList.add("show");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove("show"), 600);

  char.classList.add("pop");
  clearTimeout(popTimer);
  popTimer = setTimeout(() => char.classList.remove("pop"), 130);

  const f = document.createElement("div");
  f.className = "float";
  f.textContent = "+" + gain + " " + word;
  f.style.left = (e.clientX - 30 + (Math.random()*40-20)) + "px";
  f.style.top = (e.clientY - 20) + "px";
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1000);

  meow();
  render();
}
char.addEventListener("pointerdown", clickChar);

// ---- магазин ----
function buildShop() {
  const box = $("items"); box.innerHTML = "";
  upgradesDef.forEach(u => {
    const d = document.createElement("div");
    d.className = "item"; d.id = "up-" + u.id;
    d.innerHTML = `<div><b>${u.name}<span class="count" id="c-${u.id}">0</span></b><small>${u.desc}</small></div><div class="cost" id="p-${u.id}"></div>`;
    d.onclick = () => {
      const c = cost(u);
      if (state.score >= c) {
        state.score -= c;
        state.owned[u.id] = (state.owned[u.id]||0) + 1;
        render(); save();
      }
    };
    box.appendChild(d);
  });
}

function buildSkins() {
  const box = $("skins"); box.innerHTML = "";
  skinsDef.forEach((s, i) => {
    const b = document.createElement("div");
    const unlocked = state.total >= s.need;
    b.className = "skin" + (unlocked ? "" : " locked") + (state.skin === i ? " active" : "");
    b.textContent = unlocked ? s.name : `🔒 ${fmt(s.need)}`;
    b.onclick = () => { if (unlocked) { state.skin = i; applySkin(); buildSkins(); save(); } };
    box.appendChild(b);
  });
}

function applySkin() {
  const s = skinsDef[state.skin];
  char.style.setProperty("--hair", s.hair);
  char.style.setProperty("--hoodie", s.hoodie);
}

let lastUnlocked = -1;
function render() {
  $("score").textContent = fmt(state.score) + " ня";
  $("cps").textContent = `ня за секунду: ${perSec()} • за клік: ${perClick()}`;
  upgradesDef.forEach(u => {
    $("c-" + u.id).textContent = state.owned[u.id] || 0;
    $("p-" + u.id).textContent = fmt(cost(u));
    $("up-" + u.id).classList.toggle("locked", state.score < cost(u));
  });
  const unlockedNow = skinsDef.filter(s => state.total >= s.need).length;
  if (unlockedNow !== lastUnlocked) { lastUnlocked = unlockedNow; buildSkins(); }
}

// авто-ня
setInterval(() => {
  const g = perSec() / 10;
  if (g > 0) { state.score += g; state.total += g; render(); }
}, 100);
setInterval(save, 5000);

$("reset").onclick = () => {
  if (confirm("Точно скинути весь прогрес? 🥺")) {
    state = { score: 0, total: 0, owned: {}, skin: 0 };
    save(); lastUnlocked = -1; applySkin(); render();
  }
};

buildShop(); applySkin(); render();
</script>
</body>
</html>
